    <polygon points="144.0,256.0 256.0,227.0 256.0,285.0" fill="#5eead4"/>
    <polygon points="304.1,304.1 241.2,270.8 270.8,241.2" fill="#5eead4"/>
    <polygon points="207.9,304.1 241.2,241.2 270.8,270.8" fill="#5eead4"/>
    <polygon points="207.9,207.9 270.8,241.2 241.2,270.8" fill="#5eead4"/>
